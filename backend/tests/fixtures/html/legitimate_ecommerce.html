<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Gear - Outdoor Equipment & Apparel</title>
</head>
<body>
    <header>
        <div class="logo">Aurora Gear</div>
        <form action="/search" method="GET">
            <input type="text" name="q" placeholder="Search tents, boots, backpacks...">
            <button type="submit">Search</button>
        </form>
    </header>
    <main>
        <h1>Top Rated Camping Gear</h1>
        <div class="product-grid">
            <div class="product-card">
                <h3>Alpine 3-Season Tent</h3>
                <p>$189.99</p>
                <button type="button">Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Trail Ultralight Pack</h3>
                <p>$129.50</p>
                <button type="button">Add to Cart</button>
            </div>
        </div>
        <section class="newsletter">
            <h2>Subscribe for Trail Guides</h2>
            <form action="/newsletter/signup" method="POST">
                <input type="email" name="subscriber_email" placeholder="Your email address">
                <button type="submit">Subscribe</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Aurora Gear Co. Powered by Shopify.</p>
    </footer>
</body>
</html>
