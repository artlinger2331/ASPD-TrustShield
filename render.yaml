services:
  # ---------------------------------------------------------------------------
  # 1. TrustShield Backend Web Service (FastAPI) - Free Tier
  # ---------------------------------------------------------------------------
  - type: web
    name: trustshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_ML_CLASSIFICATION
        value: "true"
      - key: BACKEND_URL
        value: https://aspd-trustshield.onrender.com
      - key: FRONTEND_URL
        value: https://aspd-trust-shield.vercel.app

  # ---------------------------------------------------------------------------
  # 2. TrustShield Frontend Static Site (React + Vite) - Free Tier
  # ---------------------------------------------------------------------------
  - type: web
    name: trustshield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trustshield-api
          property: host

